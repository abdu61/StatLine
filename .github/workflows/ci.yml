name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release

      # Pinned rather than `EmbarkStudios/cargo-deny-action`: that action bundles
      # its own cargo-deny, and versions before 0.20.x cannot resolve a
      # workspace-inherited path dependency (`bug[unresolved-workspace-dependency]`
      # on every internal crate). This is the version the gate is verified against
      # locally, so CI and a developer run agree.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Licences, bans, advisories, sources
        run: cargo deny check licenses bans sources advisories

      - name: Render snapshots
        run: cargo run --release -p statline-app -- --render-snapshots snapshots-out

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots-out
          if-no-files-found: warn

  package:
    # Runs on a tag push: builds the release artifacts and publishes them to a
    # GitHub Release, which is what the README's `releases/latest/download/...`
    # link and the winget manifest point at.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Portable zip
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\scripts\package.ps1 -Version $version

      - name: MSIX (unsigned, not published)
        shell: powershell
        run: |
          # Kept as a build check, but not attached to the release: an unsigned
          # MSIX cannot be installed by an end user at all. `Add-AppxPackage`
          # fails with 0x800B010A ("publisher certificate could not be verified")
          # until the package is signed with a certificate the machine trusts.
          # Shipping it next to the zip only produces support requests.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\scripts\build-msix.ps1 -Version $version

      - name: Collect release notes
        shell: powershell
        run: |
          # Everything under the current version heading in CHANGELOG.md.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$version\]" | Select-Object -First 1).LineNumber
          if (-not $start) {
            "No CHANGELOG section for $version; falling back to the whole Unreleased block."
            $start = ($lines | Select-String -Pattern '^## \[Unreleased\]' | Select-Object -First 1).LineNumber
          }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($i -gt $start -and $lines[$i] -match '^## \[') { break }
            $body += $lines[$i]
          }
          $body -join "`n" | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md | Select-Object -First 5

      - name: Remove stale release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # See the note on the upload step: replacing a tag reuses the release,
          # so anything this workflow no longer builds has to be deleted by hand.
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              *.zip|*.sha256) ;;
              *) echo "removing stale asset: $name"; gh release delete-asset "$tag" "$name" --yes ;;
            esac
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StatLine ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Replacing a tag reuses the existing release object, and action-gh-release
          # only overwrites assets with the same name. A file dropped from this list
          # therefore survives from the previous run — which is how an uninstallable
          # unsigned MSIX stayed on 0.1.0 after it was removed here. Deleting first
          # keeps the release to exactly what this workflow produces.
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true

      - name: Keep artifacts on the run too
        uses: actions/upload-artifact@v4
        with:
          name: statline-packages
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.msix
          if-no-files-found: error