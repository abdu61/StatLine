name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release

      - name: Licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

      - name: Render snapshots
        run: cargo run --release -p statline-app -- --render-snapshots snapshots-out

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots-out
          if-no-files-found: warn

  package:
    # Local tags only for now; this job is ready for a release remote.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Portable zip
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\scripts\package.ps1 -Version $version

      - name: MSIX (unsigned)
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\scripts\build-msix.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: statline-packages
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.msix
          if-no-files-found: error
